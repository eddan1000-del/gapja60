name: 실행 점검(에뮬레이터)

on:
  workflow_run:
    workflows: ["APK 빌드"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v5
      - name: 최신 APK 받기
        run: curl -sL -o gapja60.apk "https://github.com/${{ github.repository }}/releases/latest/download/gapja60.apk" && ls -lh gapja60.apk
      - name: 에뮬레이터에서 실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/smoke.sh
      - name: 결과 판정
        run: |
          cat shots/report.txt | while IFS= read -r l; do echo "::notice::$l"; done
          head -30 shots/crash.txt | while IFS= read -r l; do echo "::warning::$l"; done
          grep -E " E AndroidRuntime| E kr.gapja60| E ExoPlayer" shots/logcat.txt | tail -15 | while IFS= read -r l; do echo "::warning::$l"; done
      - name: 점검 결과 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qa
          name: 실행 점검 결과 (개발용)
          prerelease: true
          make_latest: false
          files: |
            shots/*.png
            shots/report.txt
            shots/crash.txt

name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 확인
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 서명 키 준비
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "서명: 저장소 비밀값(secrets)의 키 사용"
          elif [ -f keystore/release.jks ]; then
            echo "KEYSTORE_FILE=$PWD/keystore/release.jks" >> "$GITHUB_ENV"
            echo "서명: keystore/release.jks 사용"
          else
            echo "::warning::서명 키가 없어 디버그 키로 서명합니다(업데이트 설치가 막힐 수 있음)."
          fi

      - name: 단위 테스트(네 방향 240항목 전수 검사) + 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'gapja60-store' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'gapja60' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'gapja60-store' }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILED|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: APK 확인
        run: |
          cp app/build/outputs/apk/release/app-release.apk gapja60.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions gapja60.apk
          if "$AAPT" dump permissions gapja60.apk | grep -q "android.permission.INTERNET"; then echo "::error::인터넷 권한이 들어 있습니다"; exit 1; fi
          ls -lh gapja60.apk

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 육십갑자 1.0.${{ github.run_number }}
          body: |
            안드로이드 폰에서 아래 **gapja60.apk**를 눌러 내려받아 설치하세요.
            항상 최신판 주소: https://github.com/${{ github.repository }}/releases/latest/download/gapja60.apk
          files: gapja60.apk
          make_latest: true
